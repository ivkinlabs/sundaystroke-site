name: Factory PR check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: factory-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          if-no-files-found: error
          retention-days: 14
